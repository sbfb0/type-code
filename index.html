<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBFB Type Studio | Multi-Runtime IDE</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; background: #1e1e1e; color: #fff; overflow: hidden; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #252526; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .file-controls { display: flex; gap: 8px; margin-bottom: 10px; }
        .workspace { display: flex; gap: 15px; height: calc(100vh - 160px); }
        .panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        .btn { padding: 8px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; font-size: 12px; }
        .btn-run { background: #4CAF50; padding: 10px 25px; font-size: 14px; }
        .btn-run:hover { background: #45a049; transform: scale(1.05); }
        .btn-file { background: #3e3e42; border: 1px solid #555; }
        
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; padding: 20px; border: 1px solid #333; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 14px; resize: none; outline: none; }
        .terminal { flex: 1; background: #000; color: #00FF00; padding: 15px; font-family: 'Consolas', monospace; overflow-y: auto; border: 1px solid #333; border-radius: 8px; white-space: pre-wrap; font-size: 13px; }
        .preview-box { flex: 1; background: white; border-radius: 8px; border: none; }
        
        .error-text { color: #ff5555; }
        .sys-text { color: #569cd6; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-weight: bold; color: #4CAF50;">⚡ SBFB MULTI-CODE IDE</div>
        <button onclick="runSBFB()" class="btn btn-run">▶ RUN PROGRAM</button>
    </div>

    <div class="file-controls">
        <button class="btn btn-file" onclick="newFile()">📄 New File</button>
        <span id="fileNameDisplay" style="margin-left:10px; color:#888; font-size:12px; align-self:center;">project.sbfb</span>
    </div>

    <div class="workspace">
        <div class="panel">
            <textarea id="codeInput" spellcheck="false">start:SBFB
Frontend
// This is a note and will be ignored

Createcode: python
Test.py
print("Hello from Python!")
print(5 + 5)

Createcode: javascript
Logic.js
alert("SBFB executing JavaScript!");

type ("Back to standard SBFB mode")
<end:SBFB></textarea>
        </div>

        <div class="panel">
            <iframe id="webPreview" class="preview-box"></iframe>
            <div id="outputScreen" class="terminal">Terminal ready...</div>
        </div>
    </div>

    <script>
        let pyodideInstance = null;

        async function getPyodide() {
            if (!pyodideInstance) {
                pyodideInstance = await loadPyodide();
            }
            return pyodideInstance;
        }

        function newFile() {
            document.getElementById('codeInput').value = "start:SBFB\n\n<end:SBFB>";
        }

        async function runSBFB() {
            const code = document.getElementById("codeInput").value;
            const terminal = document.getElementById("outputScreen");
            const preview = document.getElementById("webPreview");
            
            terminal.innerHTML = "<span class='sys-text'>--- Initializing SBFB Engine ---</span>\n";
            preview.srcdoc = ""; 

            let isRunning = false;
            let htmlContent = "";
            const lines = code.split('\n');

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                // Skip comments and empty lines
                if (line.startsWith("//") || line === "") continue;

                let lowerLine = line.toLowerCase();

                if (lowerLine === "start:sbfb") { isRunning = true; continue; }
                if (lowerLine === "<end:sbfb>") { isRunning = false; break; }

                if (isRunning) {
                    // PYTHON RUNTIME
                    if (lowerLine.startsWith("createcode: python")) {
                        terminal.innerHTML += "<span class='sys-text'>[System: Running Python...]</span>\n";
                        i++; // Skip the filename line (e.g. Test.py)
                        
                        let pyCode = "";
                        i++; // Move to start of code
                        while (i < lines.length && !lines[i].toLowerCase().includes("createcode:") && !lines[i].toLowerCase().includes("<end:sbfb>")) {
                            if (!lines[i].trim().startsWith("//")) pyCode += lines[i] + "\n";
                            i++;
                        }
                        i--; // Adjust index for main loop

                        try {
                            const py = await getPyodide();
                            await py.runPythonAsync(`
                                import sys, io
                                sys.stdout = io.StringIO()
                            `);
                            await py.runPythonAsync(pyCode);
                            const stdout = py.runPython("sys.stdout.getvalue()");
                            terminal.innerHTML += stdout;
                        } catch (err) {
                            terminal.innerHTML += `<span class='error-text'>Python Error: ${err}</span>\n`;
                        }
                        continue;
                    }

                    // JAVASCRIPT RUNTIME
                    if (lowerLine.startsWith("createcode: javascript")) {
                        terminal.innerHTML += "<span class='sys-text'>[System: Running JavaScript...]</span>\n";
                        i++; // Skip filename
                        
                        let jsCode = "";
                        i++;
                        while (i < lines.length && !lines[i].toLowerCase().includes("createcode:") && !lines[i].toLowerCase().includes("<end:sbfb>")) {
                            if (!lines[i].trim().startsWith("//")) jsCode += lines[i] + "\n";
                            i++;
                        }
                        i--;

                        try {
                            eval(jsCode);
                        } catch (err) {
                            terminal.innerHTML += `<span class='error-text'>JS Error: ${err}</span>\n`;
                        }
                        continue;
                    }

                    // STANDARD SBFB COMMANDS
                    if (lowerLine.startsWith("type (") && line.endsWith(")")) {
                        let content = line.substring(line.indexOf("(") + 1, line.lastIndexOf(")")).replace(/"/g, '');
                        terminal.innerHTML += content + "\n";
                    }

                    if (lowerLine.startsWith("render (") && line.endsWith(")")) {
                        let content = line.substring(line.indexOf("(") + 1, line.lastIndexOf(")")).replace(/"/g, '');
                        htmlContent += content;
                        preview.srcdoc = htmlContent;
                    }
                }
            }
            terminal.innerHTML += "<span class='sys-text'>--- Program Finished ---</span>\n";
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
